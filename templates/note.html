<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ title }}</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1a1a1a;
            --muted: #6b7280;
            --link: #2563eb;
            --link-hover: #1d4ed8;
            --border: #e5e7eb;
            --code-bg: #f3f4f6;
            --callout-bg: #f0f7ff;
            --callout-border: #3b82f6;
            --tag-bg: #e5e7eb;
            --tag-fg: #374151;
            --blockquote-border: #d1d5db;
            --img-border: #e5e7eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --fg: #e5e7eb;
                --muted: #9ca3af;
                --link: #60a5fa;
                --link-hover: #93bbfd;
                --border: #374151;
                --code-bg: #1f2937;
                --callout-bg: #1e293b;
                --callout-border: #3b82f6;
                --tag-bg: #374151;
                --tag-fg: #d1d5db;
                --blockquote-border: #4b5563;
                --img-border: #374151;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 720px;
            margin: 0 auto;
            padding: 1.25rem;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.65;
            font-size: 1rem;
        }
        h1 { font-size: 1.6rem; margin-bottom: 0.5rem; line-height: 1.3; }
        h2 { font-size: 1.25rem; margin-top: 1.75rem; margin-bottom: 0.5rem; }
        h3 { font-size: 1.1rem; margin-top: 1.25rem; margin-bottom: 0.4rem; }
        p { margin-bottom: 0.75rem; }
        a { color: var(--link); text-decoration: none; }
        a:hover { color: var(--link-hover); text-decoration: underline; }
        .meta {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .meta a { color: var(--muted); text-decoration: underline; }
        .tags { margin-top: 0.4rem; }
        .tag {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--tag-fg);
            border-radius: 3px;
            padding: 1px 7px;
            font-size: 0.78rem;
            margin-right: 4px;
            margin-bottom: 4px;
        }
        ul, ol { margin-bottom: 0.75rem; padding-left: 1.5rem; }
        li { margin-bottom: 0.3rem; }
        blockquote {
            border-left: 3px solid var(--blockquote-border);
            padding: 0.5rem 1rem;
            margin: 0.75rem 0;
            color: var(--muted);
        }
        code {
            background: var(--code-bg);
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 0.9em;
        }
        pre {
            background: var(--code-bg);
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 0.75rem 0;
        }
        pre code { background: none; padding: 0; }
        .callout {
            border-left: 4px solid var(--callout-border);
            background: var(--callout-bg);
            padding: 0.75rem 1rem;
            margin: 1rem 0;
            border-radius: 0 6px 6px 0;
        }
        .callout-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }
        .callout-content p:last-child { margin-bottom: 0; }
        .wikilink-unresolved {
            color: var(--muted);
            font-style: italic;
            border-bottom: 1px dashed var(--muted);
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid var(--img-border);
            margin: 0.75rem 0;
        }
        .img-placeholder {
            display: block;
            padding: 1rem;
            background: var(--code-bg);
            border-radius: 6px;
            color: var(--muted);
            font-size: 0.85rem;
            font-style: italic;
            margin: 0.75rem 0;
        }
        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5rem 0;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.75rem 0;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 0.4rem 0.6rem;
            text-align: left;
        }
        th { background: var(--code-bg); }
        strong { font-weight: 600; }
        .footer {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <article>
        <h1>{{ title }}</h1>
        <div class="meta">
            {% if source_url and source_url != "attachment" %}<a href="{{ source_url }}">Original source</a> · {% endif %}{{ date }}
            {% if tags %}<div class="tags">{% for tag in tags %}<span class="tag">{{ tag }}</span>{% endfor %}</div>{% endif %}
        </div>
        {{ body }}
    </article>
</body>
</html>
